# Scheda della pagina Il Pensatore: il bot la usa per i post preparati nel gruppo di questa pagina.
# Modificala liberamente. Le parti segnate DA COMPLETARE aspettano i dati di Gabriele.

nome: Il Pensatore
handle: ilpensatore

pubblico: adulti, soprattutto uomini ma anche donne (contenuti trasversali)

temi_report: >
  Relazioni uomo-donna in senso ampio e introspettivo: psicologia dell'amore, dipendenza affettiva e perdita
  di identità, perché una persona diventa distante, schemi relazionali che si ripetono, autostima e paura del
  rifiuto, rotture e distacco raccontati in modo riflessivo, nostalgia, frasi e scene in cui uomini e donne si
  riconoscono. Non seduzione pratica e non motivazionale generico.

