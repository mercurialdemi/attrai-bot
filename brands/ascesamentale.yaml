# Scheda della pagina Ascesa Mentale: il bot la usa per i post preparati nel gruppo di questa pagina.
# Modificala liberamente. Le parti segnate DA COMPLETARE aspettano i dati di Gabriele.

nome: Ascesa Mentale

handle: ascesamentale

pubblico: uomini tra i 20 e i 40 anni

temi_report: >
  Crescita personale maschile: disciplina e autocontrollo, procrastinazione, costanza, gestione degli impulsi,
  forza mentale e resilienza, paura del fallimento, abitudini, allenamento e routine, obiettivi, responsabilità,
  direzione nella vita, confini personali e indipendenza emotiva, allontanarsi da situazioni dannose.

