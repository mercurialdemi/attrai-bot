storie_voce: "Lucido e fermo, analitico, leggermente provocatorio. Porta il lettore in una scena sociale precisa (riunione, gruppo di amici, una richiesta, una battuta), nomina la dinamica che lui subiva senza vederla e gli lascia una scelta concreta. Mai motivazionale, mai urlato, mai ostile verso le donne, mai promesse di controllo sugli altri. Seconda persona, presente, frasi brevi."

