# CTA modello per ResetRelazionale: per ora solo il manuale friendzone (copiate da quelle di AttraiSeduci scritte da Gabriele).

friendzone:
  parola: FRIENDZONE
  modelli:
    - |
      Puoi essere l'uomo che la conosce meglio, quello di cui si fida e quello che cerca quando sta male. Ma questo non significa che un giorno inizierà a desiderarti.
      È proprio per questo che ho scritto "Come uscire dalla friendzone": per spiegarti la differenza tra essere apprezzato ed essere desiderato, gli errori che ti rendono soltanto un amico e cosa devi cambiare per non rimanere intrappolato in quel ruolo.
      Perché non ti serve darle ancora di più. Ti serve capire perché tutto quello che hai dato finora non è bastato. Link in bio.
    - |
      Non le dici quello che provi perché hai paura di perderla. Così continui a comportarti da amico, sperando che sia lei a fare il primo passo. Ma mentre cerchi di non rovinare il vostro rapporto, stai rinunciando proprio a quello che vorresti costruire.
      Ho scritto "Come uscire dalla friendzone" per mostrarti gli errori che ti hanno portato in questa posizione e come smettere di alimentarla.
      Puoi continuare a nascondere quello che desideri, oppure iniziare a capire come cambiare le cose. Trovi il manuale nel link in bio o commenta con "FRIENDZONE" e te lo invio in DM.
    - |
      Cambia la donna, ma il finale rimane sempre lo stesso. Diventi il suo confidente, il suo punto di riferimento, quello che c'è sempre. E quando finalmente trovi il coraggio di dichiararti, scopri che per lei sei soltanto un amico.
      Nel manuale "Come uscire dalla friendzone" ti spiego perché continui a ritrovarti in questa posizione, quali comportamenti alimentano la friendzone e come interrompere questo schema.
      Perché cambiare donna non serve, se continui a commettere gli stessi errori. Link in bio.
    - |
      La cosa più crudele della friendzone è che spesso ti accorgi di esserci dentro quando ormai sei diventato importante per lei.
      Ti cerca. Si fida di te. Ti racconta cose che non racconta agli altri. E proprio per questo continui a sperare.
      Poi una sera ti parla di un altro. E mentre tu hai impiegato mesi per diventare una delle persone più presenti nella sua vita, a lui sono bastate poche settimane per diventare l'uomo che desidera.
      Ho scritto "Come uscire dalla friendzone" proprio per chi è intrappolato in questa contraddizione: capire come sei arrivato a essere così vicino a lei… senza essere mai diventato l'uomo che vuole.
      Trovi il manuale nel link in bio.
    - |
      Il problema non è che lei ti abbia detto di vederti soltanto come un amico. Il problema è che continui a sperare che prima o poi cambi idea. Così rimani disponibile, ascolti i suoi problemi e cerchi continuamente occasioni per starle vicino.
      Per questo ho scritto "Come uscire dalla friendzone": gli errori che ti portano nella friendzone, i meccanismi psicologici che consolidano il ruolo dell'amico e come cambiare il modo in cui ti relazioni con le donne.
      Puoi continuare ad aspettare che qualcosa cambi oppure iniziare a cambiare tu. Il manuale è nel link in bio.
    - |
      Ogni volta che ti scrive, ricominci a sperare. Ogni volta che si confida, pensi di essere un passo più vicino. Ma passano le settimane, poi i mesi, e tra voi non cambia nulla.
      È una delle dinamiche che approfondisco in "Come uscire dalla friendzone". Perché se non capisci cosa ti tiene in quella posizione, rischi di continuare ad aspettare qualcosa che non arriverà.
      Trovi il manuale nel link in bio.
    - |
      Tu hai passato mesi a cercare di conquistarla. Lui è arrivato dopo e in poche settimane ha ottenuto ciò che tu desideravi da tempo. Continui a pensare che sia più bello, più interessante o più fortunato. Ma forse la differenza è nel modo in cui vi siete posti.
      Ho scritto "Come uscire dalla friendzone": quali comportamenti ti fanno percepire come amico, come nasce l'attrazione e cosa devi cambiare per non ritrovarti sempre nella stessa situazione.
      Puoi continuare a chiederti perché abbia scelto lui, oppure iniziare a capire perché non ha scelto te. Trovi il manuale nel link in bio.

