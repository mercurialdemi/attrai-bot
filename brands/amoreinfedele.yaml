# Caroselli originali da zero ogni mattina: spenti finché la pagina non è pronta (metti 2 per accenderli)
crea:
  al_giorno: 0
  ora: "08:30"

studio:
  attivo: true
  ora: "04:00"

traduzione_slide: fedele

posizionamento: >
  Pagina sulle relazioni sentimentali vissute dalle donne, con focus su tradimento, perdita della fiducia,
  dipendenza affettiva e conseguenze emotive delle relazioni dolorose. Racconta cosa succede nella mente e nel
  cuore di una donna quando la persona di cui si fidava diventa quella che la fa soffrire, e soprattutto cosa
  viene dopo. Unisce contenuti emotivi, introspettivi, spiegazioni psicologiche e approfondimenti pratici per
  aiutarla a capire ciò che ha vissuto e recuperare consapevolezza, fiducia e autonomia emotiva.
  Non è una pagina generica sull'amore e non è una pagina contro gli uomini.

tono:
  - Si rivolge a una DONNA, al femminile. Deve farle pensare "è esattamente quello che provo", "pensavo di essere l'unica".
  - Emotiva per creare identificazione, psicologica per trasformarla in comprensione. Lucida, mai melensa.
  - Tratta i paradossi (amare chi ti ha ferita, voler perdonare e controllare) come complessità dell'attaccamento, mai come debolezze o colpe di lei.
  - Precisa con i termini: non ogni relazione difficile è trauma bond, non ogni bugia è gaslighting, niente diagnosi improvvisate.
  - Non convince automaticamente a lasciarlo: aiuta a guardare la relazione con lucidità senza giustificare comportamenti dannosi.
  - Vietate le frasi da social generiche ("meriti di meglio", "chi ti ama non ti tradisce").
  - "Italiano fluido e naturale, come lo scriverebbe un'italiana: mai una traduzione parola per parola."

regole_formato:
  - Descrizione massimo 2200 caratteri.
  - Niente grassetto, niente asterischi, niente trattini lunghi.
  - Testo delle slide breve e leggibile su telefono, con la stessa divisione in frasi e lo stesso peso dell'originale.

hook:
  regola: >
    L'apertura della descrizione non parte di default dalla citazione di un autore o studio.
    Ruota tra: frase secca, confessione in prima persona, verità brutale, aneddoto di terzi, domanda retorica.
    Due descrizioni consecutive non aprono mai con la stessa struttura.
  struttura: >
    Varia apertura, sviluppo e chiusura rispetto ai post precedenti.
    Non ripetere gli autori citati di recente: pesca da un insieme ampio e vario.

cta:
  regola: |
    Questa pagina per ora non vende manuali: OGNI post chiude con la CTA "segui la pagina".
    La CTA del post originale va sempre tolta e sostituita con la nostra (anche dentro le slide).
  stile: |
    Scritta da copywriter professionista, mai banale. La CTA è la conclusione naturale del post e ne rispetta
    il formato: post a elenco -> si aggancia all'elenco; scena o dialogo -> "Se ti sei rivisto in questa scena...";
    frase o riflessione -> si aggancia a quella frase. Prima di chiedere DÀ qualcosa: un'ultima intuizione o una
    domanda introspettiva precisa. Mai domande generiche tipo "Sei d'accordo?". Niente emoji nella CTA.
  dove_si_compra: "link in bio"

scuole_di_pensiero:
  - fonte: Patrick Carnes (trauma bond)
    principi: >
      Il legame traumatico nasce dall'alternanza di dolore e ricompensa: più è imprevedibile, più è difficile staccarsi.
  - fonte: Lundy Bancroft
    principi: >
      L'uomo che controlla e svaluta non ha un problema di rabbia ma di mentalità: si sente in diritto; le scuse e le promesse fanno parte del ciclo.
  - fonte: Ramani Durvasula
    principi: >
      Il narcisista non cambia perché tu lo ami di più: idealizzazione, svalutazione e scarto sono un copione, non un incidente.

parole_censurate: [sesso, cazzo, cazzi, cazzate, cazzata, incazzato, incazzata, fottuto, fottuta, fottere, fottiti,
