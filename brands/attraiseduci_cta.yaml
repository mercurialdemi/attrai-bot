# CTA modello scritte da Gabriele (24/10/2026), una lista per manuale.
# Il bot parte SEMPRE da una di queste per la slide CTA finale: tiene la presentazione del manuale e la chiusura
# (parola da commentare / link in bio) e riscrive l'aggancio iniziale sul post.
# Il bundle Friendzone + Seduzione per ora NON si propone.

attraiseduci:
  parola: ATTRAZIONE
  modelli:
    - |
      Se vuoi davvero capire perché all'inizio ti desidera e poi perde interesse senza che tu faccia errori evidenti… devi smettere di guardare ciò che dice e iniziare a leggere ciò che succede sotto.
      Ho scritto un manuale che ti spiega i pattern reali che regolano attrazione, investimento e perdita di valore nelle relazioni, senza filtri e senza illusioni.
      Si chiama "Diventa l'uomo a cui nessuna donna sa resistere" e lo trovi nel link in bio.
      Leggilo se sei stanco di ripetere sempre gli stessi errori senza capire dove stai sbagliando davvero.
    - |
      Se vuoi davvero smettere di inseguire e capire cosa porta una donna a sceglierti invece di usarti finché le fai comodo… devi cambiare il modo in cui interpreti ogni interazione.
      Nel mio manuale "Diventa l'uomo a cui nessuna donna sa resistere" trovi le dinamiche psicologiche che spiegano perché alcune attenzioni aumentano l'attrazione e altre la distruggono, anche se sembrano giuste.
      Dai un'occhiata al link in bio o commenta con "ATTRAZIONE" e te lo invio in DM.
    - |
      Le donne ti distruggono… se non capisci come funzionano.
      Se non sai leggerle, non puoi guidarle.
      E se non sai guidarle, verrai usato.
      Se vuoi davvero scoprire come accendere il desiderio nella mente femminile… per questo ho scritto il libro "Diventa l'uomo a cui nessuna donna sa resistere".
      Commenta con "ATTRAZIONE" e te lo invio in DM.
    - |
      Molti uomini credono che serva essere belli.
      Sbagliato.
      Hai già visto quell'uomo: non è più bello di te, eppure è circondato da donne, come se fosse una calamita.
      Ti sembra magia? No, ha solo capito cosa accende davvero il desiderio nella mente femminile.
      Puoi continuare a muoverti alla cieca, con le stesse domande irrisolte, perdendo occasioni senza saperne il motivo, oppure puoi imparare le regole del gioco. La scelta è tua.
      Se credi sia giunto davvero il momento di cambiare, dai un'occhiata al link in bio.
    - |
      La psicologia femminile è il campo di gioco più spietato per un uomo che non ne capisce le regole.
      Ed è proprio per questo che in così tanti continuano a perdere valore senza accorgersene, a perdere donne senza capire cosa sbagliano… e a finire sempre con la stessa domanda: "perché con me non funziona mai?"
      Ho scritto "Diventa l'uomo a cui nessuna donna sa resistere": ti spiega passo passo ogni fase, dalla prima interazione alla camera da letto.
      Perché quando capisci le regole, tutto diventa un gioco… se vuoi smettere di essere quello "sempre buono ma mai scelto davvero", dai un'occhiata al link in bio o scrivimi "ATTRAZIONE" nei commenti o in DM.

friendzone:
  parola: FRIENDZONE
  modelli:
    - |
      Puoi essere l'uomo che la conosce meglio, quello di cui si fida e quello che cerca quando sta male. Ma questo non significa che un giorno inizierà a desiderarti.
      È proprio per questo che ho scritto "Perché lei ti ha friendzonato (e come uscirne)": per spiegarti la differenza tra essere apprezzato ed essere desiderato, gli errori che ti rendono soltanto un amico e cosa devi cambiare per non rimanere intrappolato in quel ruolo.
      Perché non ti serve darle ancora di più. Ti serve capire perché tutto quello che hai dato finora non è bastato. Link in bio.
    - |
      Non le dici quello che provi perché hai paura di perderla. Così continui a comportarti da amico, sperando che sia lei a fare il primo passo. Ma mentre cerchi di non rovinare il vostro rapporto, stai rinunciando proprio a quello che vorresti costruire.
      Ho scritto "Perché lei ti ha friendzonato (e come uscirne)" per mostrarti gli errori che ti hanno portato in questa posizione e come smettere di alimentarla.
      Puoi continuare a nascondere quello che desideri, oppure iniziare a capire come cambiare le cose. Trovi il manuale nel link in bio o commenta con "FRIENDZONE" e te lo invio in DM.
    - |
      Cambia la donna, ma il finale rimane sempre lo stesso. Diventi il suo confidente, il suo punto di riferimento, quello che c'è sempre. E quando finalmente trovi il coraggio di dichiararti, scopri che per lei sei soltanto un amico.
      Nel manuale "Perché lei ti ha friendzonato (e come uscirne)" ti spiego perché continui a ritrovarti in questa posizione, quali comportamenti alimentano la friendzone e come interrompere questo schema.
      Perché cambiare donna non serve, se continui a commettere gli stessi errori. Link in bio.
    - |
      La cosa più crudele della friendzone è che spesso ti accorgi di esserci dentro quando ormai sei diventato importante per lei.
      Ti cerca. Si fida di te. Ti racconta cose che non racconta agli altri. E proprio per questo continui a sperare.
      Poi una sera ti parla di un altro. E mentre tu hai impiegato mesi per diventare una delle persone più presenti nella sua vita, a lui sono bastate poche settimane per diventare l'uomo che desidera.
      Ho scritto "Perché lei ti ha friendzonato (e come uscirne)" proprio per chi è intrappolato in questa contraddizione: capire come sei arrivato a essere così vicino a lei… senza essere mai diventato l'uomo che vuole.
      Trovi il manuale nel link in bio.
    - |
      Il problema non è che lei ti abbia detto di vederti soltanto come un amico. Il problema è che continui a sperare che prima o poi cambi idea. Così rimani disponibile, ascolti i suoi problemi e cerchi continuamente occasioni per starle vicino.
      Per questo ho scritto "Perché lei ti ha friendzonato (e come uscirne)": gli errori che ti portano nella friendzone, i meccanismi psicologici che consolidano il ruolo dell'amico e come cambiare il modo in cui ti relazioni con le donne.
      Puoi continuare ad aspettare che qualcosa cambi oppure iniziare a cambiare tu. Il manuale è nel link in bio.
    - |
      Ogni volta che ti scrive, ricominci a sperare. Ogni volta che si confida, pensi di essere un passo più vicino. Ma passano le settimane, poi i mesi, e tra voi non cambia nulla.
      È una delle dinamiche che approfondisco in "Perché lei ti ha friendzonato (e come uscirne)". Perché se non capisci cosa ti tiene in quella posizione, rischi di continuare ad aspettare qualcosa che non arriverà.
      Trovi il manuale nel link in bio.
    - |
      Tu hai passato mesi a cercare di conquistarla. Lui è arrivato dopo e in poche settimane ha ottenuto ciò che tu desideravi da tempo. Continui a pensare che sia più bello, più interessante o più fortunato. Ma forse la differenza è nel modo in cui vi siete posti.
      Ho scritto "Perché lei ti ha friendzonato (e come uscirne)": quali comportamenti ti fanno percepire come amico, come nasce l'attrazione e cosa devi cambiare per non ritrovarti sempre nella stessa situazione.
      Puoi continuare a chiederti perché abbia scelto lui, oppure iniziare a capire perché non ha scelto te. Trovi il manuale nel link in bio.

potere-sociale:
  parola: BUNDLE
  modelli:
    - |
      Puoi imparare cosa dire a una donna. Ma se quando entri in una stanza nessuno sente davvero la tua presenza, il problema è più grande della seduzione.
      È per questo che abbiamo unito "AttraiSeduci" + "Potere Sociale": il primo lavora su attrazione, psicologia femminile, approccio e tensione; il secondo su presenza, rispetto, assertività e capacità di muoverti nei gruppi.
      Se non vuoi passare altri anni a guardare altri uomini prendersi le donne, il rispetto e le opportunità che avresti voluto per te, scrivi "BUNDLE" nei commenti o in DM.
    - |
      Tutti vogliono le conseguenze. Pochi costruiscono le cause.
      Ed è qui che entrano "AttraiSeduci" + "Potere Sociale". Due manuali, due aree che cambiano la vita di un uomo: donne e persone. Nel primo impari ad approcciare, comprendere la psicologia femminile e creare attrazione. Nel secondo lavori su sicurezza sociale, rispetto, assertività e capacità di guidare.
      Le qualità che dici di avere non cambieranno niente finché rimangono dentro la tua testa. Scrivi "BUNDLE" nei commenti o in DM e ti mando entrambi i manuali.
    - |
      Puoi imparare tutte le tecniche di seduzione che vuoi, ma se gli altri non ti rispettano continuerai a partire da una posizione di svantaggio. Il modo in cui una donna ti percepisce dipende anche dal valore sociale che trasmetti.
      Per questo ho riunito "AttraiSeduci" e "Potere Sociale" in un unico bundle: due manuali per comprendere l'attrazione, sviluppare carisma e costruire una presenza che non passa inosservata.
      Puoi continuare a cercare approvazione oppure imparare a farti rispettare. Link in bio.
    - |
      Entri in una stanza e nessuno sembra accorgersi di te. Parli e vieni interrotto. Ti interessa una donna, ma non sai come distinguerti dagli altri uomini. Il problema non è soltanto ciò che dici, ma il modo in cui vieni percepito.
      Nel bundle "AttraiSeduci" + "Potere Sociale" ho racchiuso i principi della seduzione, della comunicazione e delle dinamiche di potere che regolano le interazioni sociali.
      Perché non basta essere presente. Devi lasciare un'impressione. Trovi il bundle nel link in bio.
    - |
      Se devi continuamente cercare l'attenzione delle donne e l'approvazione degli altri, stai lasciando che siano loro a determinare il tuo valore.
      Ho creato il bundle "AttraiSeduci" + "Potere Sociale" per insegnarti come funzionano l'attrazione, il carisma e le gerarchie sociali, e come smettere di comportarti da uomo che cerca continuamente conferme.
      La scelta è tua: continuare a inseguire l'attenzione oppure costruire una presenza capace di attirarla. Link in bio o commenta con "BUNDLE".
    - |
      Hai mai osservato quegli uomini che attirano l'attenzione senza dover dimostrare niente? Le donne li notano, gli altri li ascoltano. Non è una questione di aspetto fisico.
      Nel bundle "AttraiSeduci" + "Potere Sociale" ho raccolto i principi psicologici dell'attrazione e dell'influenza sociale: cosa distingue un uomo che viene ignorato da uno che viene ascoltato e desiderato.
      Puoi continuare a guardare gli altri ottenere ciò che vorresti, oppure lavorare su ciò che ti manca. Link in bio.
