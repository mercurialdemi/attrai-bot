# LE 6 STRUTTURE DELLE STORIE (Gabriele, 6/11) — valgono per tutte le pagine e per qualsiasi dolore.
# Il bot ne sceglie una a rotazione (quella usata meno di recente adatta al tipo di serie), oppure quella chiesta:
#   /storie pas gelosia   ·   /storie vendita mito friendzone
# Si possono modificare liberamente: il bot rilegge questo file a ogni serie.
# categoria: identificazione (si riconosce) · autorita (capisce un meccanismo nuovo) · conversione (vuole risolvere)
# tipi: con quali serie si può usare (didattica e/o vendita)

# Ogni riga dice la FUNZIONE della slide, non le parole da usare: il bot non deve copiarne le frasi.

pas:
  nome: PAS · problema, agitazione, soluzione
  categoria: conversione
  tipi:
  - vendita
  - didattica
  parole:
  - pas
  - problema
  slide:
  - 'GANCIO: il problema detto come lo vive lui, in una scena precisa che lo colpisce. Breve, deve fermare lo scroll.'
  - 'AGITAZIONE: perché succede e cosa gli costa davvero, con un dettaglio concreto della sua vita.'
  - '(facoltativa) CONSEGUENZA: dove lo porta se continua così.'
  - 'SOLUZIONE: il principio che cambia le cose, come risposta naturale al problema. Didattica: chiudi lì. Vendita: il manuale
    come passo successivo.'
bab:
  nome: BAB · prima, dopo, ponte
  categoria: identificazione
  tipi:
  - vendita
  - didattica
  parole:
  - bab
  - prima-dopo
  - trasformazione
  slide:
  - 'GANCIO: la situazione in cui si trova adesso, in un''immagine che lo fa sentire scoperto. Breve, ferma lo scroll.'
  - 'IL CONTRASTO: la stessa situazione vissuta da chi ha capito, e cosa cambia nella testa di lei. Concreto e credibile,
    mai promesse.'
  - 'IL PONTE: cosa separa le due versioni, detto come scoperta e non come regola. Didattica: chiudi lì. Vendita: il manuale
    è il ponte.'
epifania:
  nome: Gancio, storia, offerta (ponte dell'epifania)
  categoria: identificazione
  tipi:
  - vendita
  - didattica
  parole:
  - epifania
  - storia
  - hso
  slide:
  - 'GANCIO: una situazione sorprendente e realistica, nel mezzo della scena.'
  - 'LA STORIA: cosa succede, in frasi brevi; il lettore si riconosce in chi la vive. Mai casi o clienti inventati.'
  - 'LA SCOPERTA: il cambio di prospettiva che ribalta come leggeva la situazione.'
  - 'LA NUOVA REGOLA: cosa ne deriva. Vendita: la regola (solo cosa, mai il come) e il manuale come passo successivo.'
mito:
  nome: Il mito smontato (contrarian)
  categoria: autorita
  tipi:
  - didattica
  - vendita
  parole:
  - mito
  - contrarian
  - credenza
  slide:
  - 'GANCIO: la convinzione che tutti ripetono, presentata in modo da far venire il dubbio.'
  - 'LA SFIDA: un fatto osservabile o una domanda che la manda in crisi. Mai statistiche inventate.'
  - 'LA VERITÀ: perché la convinzione è sbagliata o incompleta e cosa succede davvero.'
  - 'CHIUSURA: la conseguenza per lui. Vendita: chi ci ha creduto ha costruito su un errore, il manuale riparte da lì.'
scqa:
  nome: SCQA · situazione, complicazione, domanda, risposta
  categoria: autorita
  tipi:
  - didattica
  parole:
  - scqa
  - meccanismo
  - spiegazione
  slide:
  - 'GANCIO: fa la cosa che sembra giusta e ottiene l''opposto, detto in modo che lo punga.'
  - 'IL PERCHÉ: il meccanismo che spiega il paradosso, con un esempio concreto della sua vita.'
  - 'COSA CAMBIA: cosa fare d''ora in poi, come conseguenza ovvia del meccanismo. Senza vendere.'
ciclo:
  nome: Il ciclo aperto · promessa, indizi, rivelazione
  categoria: identificazione
  tipi:
  - didattica
  parole:
  - ciclo
  - loop
  - segreto
  - curiosita
  slide:
  - 'GANCIO: annuncia che esiste qualcosa (un segnale, un errore, una frase) senza dire cos''è.'
  - 'GLI INDIZI: cosa non è e un indizio che restringe; la risposta resta sospesa.'
  - 'LA RIVELAZIONE: la risposta, chiara, e come usarla subito.'
