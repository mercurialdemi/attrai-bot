# STRUTTURE DELLE STORIE INSTAGRAM (decise con Gabriele il 2/11): 2 didattiche, 2 di vendita, 1 box domande.
# Valgono per tutte le pagine: tono, pubblico, dolori e manuali vengono dalla scheda della pagina (e da storie_voce).
# Il bot ne sceglie una per serie, segue i ruoli storia per storia e non ripete la stessa di recente.

regole_generali:
  - "Massimo 25-30 parole per storia: si legge in 3-4 secondi. Un'idea sola per storia."
  - "STORIA 1 = GANCIO: una scena o una frase che il pubblico riconosce subito. Mai saluti, mai 'oggi parliamo di'."
  - "Ogni storia deve far toccare la successiva: chiudi con una frase sospesa o un 'ma' quando serve."
  - "Uno sticker entro la terza storia (sondaggio o quiz): un piccolo sì che tiene dentro."
  - "Mai inventare testimonianze, numeri, risultati o scadenze. Le prove sociali solo se Gabriele le fornisce."
  - "Vendita: si parte SEMPRE dal dolore, il manuale arriva alla fine in una riga, titolo tra virgolette, mai l'indice."
  - "Linguaggio parlato, seconda persona, presente. Niente emoji, niente hashtag."

didattica:
  descrizione: "Insegna UNA cosa concreta: chi guarda ne esce sapendo riconoscere o fare qualcosa. Costruisce autorevolezza e fa condividere."
  strutture:
    - id: meccanismo-nascosto
      nome: "Il meccanismo nascosto"
      quando: "Una situazione che il pubblico vive spesso e si spiega male."
      storie:
        - "SCENA: la situazione detta come la vive chi guarda, al presente, in 1-2 frasi secche."
        - "LA SCUSA CHE SI RACCONTA: la spiegazione sbagliata che si dà di solito, e che non regge. + sticker SONDAGGIO 'Ti è successo?' (Sì / Troppe volte)."
        - "IL MECCANISMO VERO: cosa succede davvero sotto, in 2 frasi chiare."
        - "COSA FARE DA DOMANI: una sola azione concreta, precisa."
        - "CHIUSURA: una frase da screenshot che fissa il concetto + 'Mandala a chi ne ha bisogno'."
    - id: errori-in-fila
      nome: "Gli errori in fila"
      quando: "Un tema che si spezza bene in 3 comportamenti sbagliati e riconoscibili."
      storie:
        - "GANCIO: '3 errori che ti fanno perdere [cosa]. Il terzo lo fai di sicuro.'"
        - "ERRORE 1: cosa fai (scena breve) e cosa capisce davvero l'altra persona."
        - "ERRORE 2: cosa fai e cosa capisce davvero l'altra persona."
        - "ERRORE 3, il più comune: cosa fai e cosa capisce davvero l'altra persona."
        - "Sticker SONDAGGIO o QUIZ: 'Quale fai più spesso?' (1 / 2 / 3)."
        - "LA REGOLA: una frase sola che li riassume tutti e tre."

vendita:
  descrizione: "Porta al manuale giusto vendendo il cambiamento, non il libro: dolore, presa di coscienza, speranza, manuale in una riga, azione semplice."
  strutture:
    - id: dolore-manuale
      nome: "Dal dolore al manuale"
      quando: "Un dolore preciso collegato direttamente a un manuale."
      storie:
        - "DOLORE IN SCENA: la situazione come la vive, una scena precisa. + sticker SONDAGGIO 'Ti succede?' (Sì / No)."
        - "IL COSTO: cosa gli sta togliendo se continua così (rispetto, attrazione, tempo, stima di sé). Concreto."
        - "LA FALSA CREDENZA: quello che pensa di dover fare, e perché lo tiene lì. Smontata in 2 frasi."
        - "LO SPIRAGLIO: si può ribaltare, e non serve cambiare chi sei. Speranza concreta."
        - "IL MANUALE IN UNA RIGA: 'Per questo ho scritto \"[titolo]\"' + cosa capirà dopo averlo letto. Mai l'indice."
        - "AZIONE: 'Scrivimi [PAROLA] in DM' (parola in grande) oppure link in bio."
    - id: obiezione
      nome: "L'obiezione"
      quando: "Quando il dolore ha un sintomo chiaro e una scusa tipica che blocca chi lo vive."
      storie:
        - "QUALIFICA: 'Ti riconosci in questo?' + il sintomo preciso. Sticker SONDAGGIO (Sì / No)."
        - "CAMBIO DI PROSPETTIVA: 'Se hai detto sì, il problema non è quello che pensi' + qual è davvero."
        - "LA SCUSA PIÙ COMUNE ('tanto non funziona', 'il mio caso è diverso', 'è tardi') e perché non regge."
        - "IL DOPO: la stessa scena dell'inizio, ribaltata, per chi l'ha capito."
        - "MANUALE + AZIONE: titolo tra virgolette in una riga + 'Scrivimi [PAROLA] in DM'. Urgenza solo vera, mai inventata (es. 'ogni settimana che aspetti, si abitua a trattarti così')."

domande:
  descrizione: "Box domande: fa scrivere il pubblico (le risposte fanno salire le storie e danno idee per i contenuti). Le risposte si fanno dopo, una per domanda, con /risposta."
  strutture:
    - id: box-domande
      nome: "Il box domande"
      quando: "Sempre: per far parlare il pubblico su un tema e raccogliere i suoi dolori veri."
      storie:
        - "GANCIO + BOX: 'Fammi la domanda che non faresti a nessuno su [tema]' + sticker DOMANDA (testo del box breve, es. 'Chiedimi tutto su [tema]')."
        - "ESEMPIO PER SBLOCCARE: una domanda tipo, scritta come la scriverebbe il pubblico (es. 'Tipo: perché torna sempre quando sto meglio?') + 'Rispondo domani, una per una.'"
