# Scheda della pagina ResetRelazionale: il bot la usa per i post preparati nel gruppo di questa pagina.
# Modificala liberamente. Le parti segnate DA COMPLETARE aspettano i dati di Gabriele.

nome: ResetRelazionale
handle: resetrelazionale

pubblico: uomini dai 25 ai 55 anni
temi_report: >
  Fine di una relazione vista dall'uomo: rotture, distacco emotivo, dipendenza affettiva, non riuscire a
  dimenticare lei, cercare risposte su cosa è successo, sentirsi persi dopo la separazione, vivere in funzione
  dell'ex, autostima e ricostruzione di sé. Non la riconquista dell'ex.

# Collaboratori di ResetRelazionale (dal file di Gabriele, 28/10/2026). Altri: /aggiungi @pagina dal gruppo
