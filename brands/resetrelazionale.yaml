  ora: "08:30"

studio:                  # spento per risparmiare crediti: per questa pagina solo report e perché della domenica
  attivo: false
  ora: "04:00"

traduzione_slide: fedele

posizionamento: >
  Pagina per uomini che stanno affrontando la fine di una relazione e vogliono ritrovare se stessi.
  Contenuti psicologici, riflessioni e consigli pratici per capire le dinamiche relazionali, recuperare
  lucidità emotiva, ricostruire la propria identità e diventare indipendenti affettivamente.
  Il nostro obiettivo non è insegnare a riconquistare una donna, ma aiutare un uomo a riconquistare se stesso:
  la fine di una relazione non è la fine della propria identità, può essere il punto di partenza.

tono:
  - "Maschile, diretto, lucido: parla a un uomo ferito come un fratello maggiore che ci è già passato. Mai cinico verso di lui."
  - "Riconosce il dolore e poi spinge a riprendersi in mano la vita. Niente vittimismo, niente romanticismo."
  - "Mai consigli per riconquistarla: il centro è lui, la sua identità, la sua lucidità."
  - "Italiano fluido e naturale, come lo scriverebbe un italiano: mai una traduzione parola per parola."
  - "Niente slang giovanile o da strada (fra, bro, zio, raga): tono adulto e sicuro."

regole_formato:
  - Descrizione massimo 2200 caratteri.
  - Niente grassetto, niente asterischi, niente trattini lunghi.
  - Testo delle slide breve e leggibile su telefono, con la stessa divisione in frasi e lo stesso peso dell'originale.

hook:
  regola: >
    L'apertura della descrizione non parte di default dalla citazione di un autore o studio.
    Ruota tra: frase secca, confessione in prima persona, verità brutale, aneddoto di terzi, domanda retorica.
    Due descrizioni consecutive non aprono mai con la stessa struttura.
  struttura: >
    Varia apertura, sviluppo e chiusura rispetto ai post precedenti.
    Non ripetere gli autori citati di recente: pesca da un insieme ampio e vario.

cta:
  regola: |
    Post DIDATTICO o che apre un dolore preciso legato al manuale -> CTA al manuale giusto (vedi manuali).
    Post VIRALE, emotivo, di riflessione, o non collegabile al manuale -> CTA segui la pagina.
    Post a immagine singola -> CTA segui la pagina.
    La CTA del post originale va sempre tolta e sostituita con la nostra (anche dentro le slide).
  stile: |
    Scritta da copywriter professionista, mai banale. Parte dal dolore del post, mai dal manuale; il manuale
    arriva solo alla fine in una riga ("Ho scritto un manuale che..."). Tocca il dolore, crea urgenza, mostra
    uno spiraglio di speranza, distrugge una falsa credenza. Non promette che lei tornerà.
    La CTA rispetta il formato del post: elenco -> si aggancia all'elenco; scena -> "Se ti sei rivisto in questa
    scena..."; frase o riflessione -> si aggancia a quella frase. Prima di chiedere DÀ qualcosa: un'ultima
    intuizione o una domanda introspettiva precisa. Niente emoji. Titolo del manuale sempre tra virgolette.
  dove_si_compra: "link in bio"

scuole_di_pensiero:
  - fonte: Helen Fisher
    principi: >
      Dopo una rottura il cervello reagisce come in astinenza: per questo il contatto zero funziona e ogni messaggio all'ex riaccende la dipendenza.
  - fonte: John Bowlby (teoria dell'attaccamento)
    principi: >
      La rottura riattiva le ferite di attaccamento: ansia, ricerca dell'altro, protesta, poi disperazione e infine distacco.
  - fonte: Guy Winch
    principi: >
      Il cuore spezzato va trattato come una ferita: idealizzare l'ex e cercare risposte allunga la guarigione; servono abitudini nuove e sguardo lucido su com'era davvero.

parole_censurate: [sesso, cazzo, cazzi, cazzate, cazzata, incazzato, incazzata, fottuto, fottuta, fottere, fottiti,
                   merda, puttana, puttane, stronzo, stronza, stronzate, coglione, coglioni, troia, troie, figa,
                   scopare, scopata]

manuali:
  - id: friendzone
    nome: "Come uscire dalla friendzone"
    titoli: ["Come uscire dalla friendzone", "Come uscire dalla friend-zone"]
    vendita: >
      Si propone SOLO quando il post tocca il dolore di essere stato vicino a lei ma non scelto: il confidente,
      l'amico, quello che c'era sempre e non è mai stato desiderato, anche dopo la fine di una storia.
      Per i post sulla rottura in generale la CTA resta "segui la pagina".
    dolori: >
      Per l'uomo che per lei è importante ma non desiderato: lo cerca, si confida, gli racconta degli altri,
      e non prova nessuna attrazione. Resta in un limbo: vicino ma mai scelto. Disponibilità eccessiva,
      idealizzazione, rinuncia alle proprie priorità e paura di perderla. Non capisce perché gentilezza e
      presenza costante non bastano e perché lei sceglie un altro. Differenza tra essere apprezzato ed essere
      desiderato, dipendenza emotiva, come smettere di aspettare di essere scelto.
      Non promette che lei si innamorerà.

