# Profilo della pagina di destinazione.
# Tutto quello che scrivi qui il bot lo usa a ogni post: modificalo liberamente.
# Le righe con "DA COMPILARE" vanno riempite prima di andare online.

nome: AttraiSeduci
handle: attraiseduci          # handle Instagram senza @

# ---------------------------------------------------------------
# PAGINE MONITORATE dal report mattutino: vostre pagine e collaboratori autorizzati.
# Handle Instagram senza @, tutti minuscoli, uno per riga.
# (I link che mandi a mano invece vengono accettati da qualsiasi pagina.)
# ---------------------------------------------------------------
pagine_monitorate:
  - attraiseduci
  # collaboratori autorizzati (24/10/2026)
  - masculineprints
  - masculinecreed
  - masculineriots
  - masculinemind
  - badboyscode
  - masculinecraze
  - thementalpower
  - romances
  - poetsandquotes_
  - black_thoughtss_

# Pagine da cui il bot STUDIA strutture, hook e temi (mai copiare i testi): per i post originali da zero
pagine_studio:
  - convincimii

report:
  ora: "08:00"           # ora italiana; lascia vuoto ("") per disattivare il report automatico
  fuso: Europe/Rome
  finestra_ore: 72       # considera i post pubblicati negli ultimi 3 giorni (anche quelli partiti piano)
  candidati: 15          # quanti post mettere in classifica
  quanti_post: 5         # quanti preparare già pronti
  post_per_pagina: 30    # post letti per pagina per calcolare la sua media
  punteggio_minimo: 1.5  # solo post andati almeno 1,5 volte la media della loro pagina (1.0 = nella media)
  completa_sempre: false # false = mai post sotto la soglia, anche se quel giorno ce ne sono pochi
  prepara_post: false    # false = il report manda solo i link dei migliori post (non spende crediti);
                         # true  = li manda già tradotti e pronti (quanti_post ogni mattina)

# Studio automatico della pagina (stile, CTA, risultati dei post del bot): ogni settimana
studio:                  # lo studio della pagina si rifà da solo ogni notte (riepilogo il lunedì)
  attivo: true
  ora: "04:00"

# Come tradurre il testo delle slide:
#   fedele   = stesso contenuto, ordine e tono dell'originale, in italiano naturale (consigliato per i post già scelti)
#   adattata = riscritto nel tono di AttraiSeduci
# La descrizione invece è sempre scritta nel tono di AttraiSeduci.
traduzione_slide: fedele

posizionamento: >
  Psicologia maschile, attrazione, seduzione e dinamiche di coppia per uomini.
  Voce di riferimento italiana nella nicchia.

tono:
  - Maschile, crudo, diretto, machiavellico. Mai romantico.
  - Sul comportamento femminile tagliente quando il contenuto lo richiede, mai addolcito, sempre ancorato ad autori e studi reali e pertinenti.
  - "Italiano fluido e naturale, come lo scriverebbe un italiano: mai una traduzione parola per parola."
  - "Niente slang giovanile o da strada (fra, bro, zio, raga): tono adulto e sicuro."

regole_formato:
  - Descrizione massimo 2200 caratteri.
  - Niente grassetto, niente asterischi, niente trattini lunghi.
  - Testo delle slide breve e leggibile su telefono, con la stessa divisione in frasi e lo stesso peso dell'originale.

hook:
  regola: >
    L'apertura della descrizione non parte di default dalla citazione di un autore o studio.
    Ruota tra: frase secca (autore citato dopo), confessione in prima persona, verità brutale,
    aneddoto di terzi, domanda retorica. Due descrizioni consecutive non aprono mai con la stessa struttura.
  struttura: >
    Varia apertura, sviluppo e chiusura rispetto ai post precedenti.
    Non ripetere gli autori citati di recente: pesca da un insieme ampio e vario.

cta:
  regola: |
    Post a immagine singola -> CTA segui la pagina.
    Post didattico, di valore, o che apre un problema specifico / un dolore forte (anche caroselli a dialogo) -> CTA ad acquistare il manuale giusto.
    Post da volume / virale con poco valore reale -> CTA segui la pagina.
    La CTA del post originale va sempre tolta e sostituita con quella di AttraiSeduci (anche dentro le slide).
    OGNI post ha la sua CTA finale (anche le immagini singole). CTA al manuale SOLO se il post dà valore reale
    ed è chiaramente collegato al dolore che risolve quel manuale; in tutti gli altri casi (post leggero, virale,
    non collegabile a un manuale) -> CTA segui la pagina.
  stile: |
    Scritta da copywriter professionista. Con più manuali chi legge deve capire QUALE gli proponi: una sola riga
    che dice di cosa parla il manuale ("Ho scritto un manuale che..."), mai l'elenco dei contenuti.
    Struttura: aggancio al post (nel suo formato) -> il dolore -> una riga sul manuale -> parola da commentare
    o link in bio. Base: i modelli scritti da Gabriele in attraiseduci_cta.yaml.
    Tocca il dolore, crea urgenza, mostra uno spiraglio di speranza, distrugge le false credenze.
    Il contenuto non parte mai dal manuale: si parte dal dolore, il manuale arriva solo alla fine.
    La CTA deve DARE qualcosa prima di chiedere: un'ultima intuizione che fa riflettere oppure una domanda
    introspettiva precisa che costringe il lettore a guardarsi dentro (es. "In quale di questi tre momenti
    non l'hai mai vista?"), poi l'invito. Mai domande generiche tipo "Sei d'accordo col post?".
    La CTA è la conclusione naturale del post e ne rispetta il formato, anche quando è "segui la pagina":
    post a elenco (5 segnali, 3 cose da fare) -> si aggancia all'elenco ("Se anche uno solo di questi segnali ti
    riguarda..."); scena o dialogo -> "Se ti sei rivisto in questa scena..."; frase o riflessione -> si aggancia
    a quella frase. Mai parlare di "scena" se nel post non c'è una scena.
    Niente emoji nella CTA (né cuori né frecce prima di "Segui").
    Il titolo di un manuale va SEMPRE tra virgolette, sia nelle slide sia nella descrizione
    (es. nel manuale "Come diventare l'uomo a cui nessuna sa resistere"), così si capisce che è un titolo.
  dove_si_compra: "link in bio"

# Scuole di pensiero da cui prendere ISPIRAZIONE (principi e modo di ragionare, mai frasi copiate, mai nominati
# nei post). Servono a scrivere descrizioni e CTA con la profondità di chi ha fatto scuola nel settore.
scuole_di_pensiero:
  - fonte: David DeAngelo
    principi: >
      L'attrazione non è una scelta razionale: lei la sente, non la decide. Essere gentili e disponibili non
      genera attrazione, la genera la sicurezza. Ironia sicura di sé invece di cercare approvazione. Chi rincorre
      perde valore ai suoi occhi.
  - fonte: Neil Strauss
    principi: >
      Riprova sociale e preselezione: un uomo desiderato da altri vale di più. Il gioco interiore conta più delle
      tecniche: le tecniche senza identità crollano. Il vero cambiamento è diventare l'uomo, non recitarlo.
  - fonte: Mark Manson (Models)
    principi: >
      Non-bisogno (non-neediness): attrae chi non dipende dalla risposta di lei. Onestà e vulnerabilità come
      forza: dire cosa vuoi e accettare il rifiuto. Polarizzare: meglio piacere molto a poche che poco a tutte.
      Il rifiuto è informazione, non un giudizio sul tuo valore.
  - fonte: Richard La Ruina
    principi: >
      L'azione batte la teoria: la paura si scioglie solo esponendosi. Passi concreti e graduali, una abilità
      alla volta. Nessuno nasce bravo: è un'abilità allenabile come le altre.
  - fonte: Mystery (Il metodo Mystery)
    principi: >
      L'attrazione ha delle fasi: prima attrazione, poi fiducia e conforto, poi seduzione; saltarle fa fallire
      tutto. Dimostrare valore senza dichiararlo: si mostra con i fatti e con come ti trattano gli altri. Lei mette
      alla prova la tua sicurezza: chi supera la prova con calma e ironia guadagna punti, chi si giustifica li perde.
  - fonte: Robert Greene (L'arte della seduzione)
    principi: >
      Mistero e ambiguità tengono viva l'attenzione; la disponibilità totale la spegne. La scarsità crea valore.
      Seduce chi sa leggere i bisogni nascosti dell'altra persona.
  - fonte: Eugene Schwartz (scrittura che vende)
    principi: >
      Il desiderio non si crea, si incanala: parti dal dolore che il lettore sente già. Parla al suo livello di
      consapevolezza: se non sa di avere il problema, prima mostraglielo; se lo sa, mostragli la via d'uscita.
  - fonte: Gary Halbert (scrittura che vende)
    principi: >
      Specificità batte genericità: una scena precisa vende più di mille aggettivi. Scrivi come parli a un amico.
      Una sola idea forte per messaggio.

manuali:
  # Quale manuale per quale dolore (decide la CTA). Mai proporre il bundle friendzone + seduzione.
  - id: attraiseduci
    nome: AttraiSeduci (manuale di seduzione)
    titoli: ["Diventa l'uomo a cui nessuna donna sa resistere", "Come diventare l'uomo a cui nessuna sa resistere"]
    dolori: >
      Tutto ciò che serve per creare una presenza magnetica, entrare nella mente di una donna e capire come
      funziona davvero il desiderio femminile. Per l'uomo che non sa creare attrazione o la perde per strada:
      cerca tecniche e copioni e viene percepito come bisognoso (frame da elemosina, fame di approvazione,
      paura del rifiuto). Approccio, conversazioni piatte senza tensione, passaggio al contatto fisico, al bacio
      e alla prima volta, il giorno dopo scrive troppo, perde valore quando è troppo preso. Anche distacco e
      scarsità, no contact dopo una rottura, rispetto perso dentro la coppia.
  - id: potere-sociale
    nome: "Bundle AttraiSeduci + Potere Sociale"
    titoli: ["Potere Sociale"]
    vendita: >
      Potere Sociale NON si vende da solo: esiste solo nel bundle con il manuale di seduzione AttraiSeduci.
      Si propone quando il post parla di RISPETTO, DINAMICHE SOCIALI, MASCOLINITÀ, status, frame e leadership.
      Nella CTA spiega che dinamiche sociali e attrazione seguono le stesse logiche: chi viene rispettato dagli
      uomini viene desiderato dalle donne, e chi non sa farsi rispettare nel gruppo perde anche lei.
      Mai dire "il manuale Potere Sociale" da solo: si parla sempre del bundle.
    dolori: >
      Per l'uomo competente ma invisibile. Lo interrompono, le sue idee vengono ignorate e prese sul serio
      solo se le dice un altro, al lavoro gli parlano sopra, nei gruppi è "quello tranquillo".
      Vede gente mediocre rispettata più di lui e non capisce perché. Non sa dire di no, si fa mettere
      i piedi in testa, non guida le situazioni. Frame, postura e occupazione dello spazio,
      calma come potere, reputazione, riprova sociale, mascolinità e uso dell'ambiguità.
  - id: friendzone
    nome: "Come uscire dalla friendzone"
    titoli: ["Come uscire dalla friendzone", "Come uscire dalla friend-zone"]
    vendita: >
      Si propone SOLO quando il post tocca il dolore di essere vicino a lei ma non scelto: il limbo, essere
      importante ma non desiderato. Mai proporlo in bundle con il manuale di seduzione.
    dolori: >
      Per l'uomo che per lei è importante ma non desiderato: lo cerca, si confida, gli racconta degli altri,
      e non prova nessuna attrazione. Resta in un limbo: vicino ma mai scelto. È diventato il suo confidente
      con disponibilità eccessiva, idealizzazione, rinuncia alle proprie priorità e paura di perderla, e ha
      scambiato fiducia e affetto per segnali di interesse. Non capisce perché gentilezza, favori e presenza
      costante non bastano, e perché lei sceglie un altro. Differenza tra essere apprezzato ed essere desiderato,
      dipendenza emotiva, iniziativa, come smettere di aspettare di essere scelto.
      Tesi: non ci sei finito perché hai fatto troppo poco per lei, ma perché hai rinunciato alla tua indipendenza.
      Non promette che lei si innamorerà: la CTA non deve promettere risultati garantiti con lei.

# Il nostro marchio che sostituisce il watermark della pagina di origine.
watermark:
  solo_se_presente: true       # true = il logo va solo sulle slide che avevano il watermark della pagina di origine
  testo: AttraiSeduci
  posizione: basso-destra      # basso-destra | basso-sinistra | basso-centro | alto-destra | alto-sinistra
  larghezza_logo: 0.075         # diametro del logo rispetto alla larghezza della slide
  colore_testo: auto          # auto = bianco su sfondi scuri, nero su sfondi chiari

# Usato solo in modalità "overlay" (testo scritto dal codice invece che da Gemini).
testo_overlay:
  colore: "#FFFFFF"
  contorno: "#000000"
  posizione: centro            # centro | alto | basso
